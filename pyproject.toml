[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blaugarnet-sow"
version = "0.1.0"
description = "Grounded Statement of Work drafter for the Harding Outfitters engagement"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.69,<1"]
openai = ["openai>=2,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
sow = "sow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
